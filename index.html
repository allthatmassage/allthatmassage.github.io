<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All That Massage</title>
<style>
  :root{--bg:#e6e9ef;--dark:#b8bec9;--light:#ffffff;--text:#4a505e}
  html,body{margin:0;height:100%;background:var(--bg);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  .plate{padding:44px 56px;border-radius:40px;text-align:center;background:var(--bg);
    box-shadow:14px 14px 30px var(--dark),-14px -14px 30px var(--light)}
  h1{margin:0;font-size:clamp(30px,7vw,64px);letter-spacing:-1px;color:#7a5cc4;
    text-shadow:2px 2px 3px var(--light),-1px -1px 2px rgba(0,0,0,.08)}
  p{margin:14px 0 0;font-size:clamp(16px,3.6vw,22px);color:var(--text);font-weight:700}
</style>
</head>
<body>
  <div class="plate">
    <h1>All That Massage</h1>
    <p>시각장애인 안마원 찾기 · 곧 열립니다</p>
  </div>
</body>
</html>
